<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#7b2d3e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Integra PLD" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>Integra PLD — Expedientes · KYC · Cumplimiento</title>
    <style>
      #boot-splash {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem;
        font-family: system-ui, -apple-system, sans-serif;
        background: #faf8f6;
        color: #2c1810;
        text-align: center;
      }
      #boot-splash strong { font-size: 1.25rem; }
      #boot-splash span { color: #6b5c54; font-size: 0.9rem; max-width: 280px; }
      .boot-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #e8ddd4;
        border-top-color: #7b2d3e;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash" aria-live="polite">
        <div class="boot-spinner" aria-hidden="true"></div>
        <strong>Integra PLD</strong>
        <span>Cargando… en celular puede tardar unos segundos.</span>
      </div>
    </div>
    <noscript>
      <p style="padding:2rem;font-family:system-ui;text-align:center">
        Integra PLD requiere JavaScript. Abre
        <a href="https://juridicofiscaleg-cell.github.io/integra-pld/">integra-pld</a>.
      </p>
    </noscript>
    <script>
      /* Limpia service workers viejos que dejaban la pantalla en blanco en móvil */
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.unregister() })
        })
      }
      if ('caches' in window) {
        caches.keys().then(function (keys) {
          keys.filter(function (k) { return k.indexOf('integra-pld') === 0 }).forEach(function (k) {
            caches.delete(k)
          })
        })
      }
      window.addEventListener('error', function (e) {
        var t = e.target
        if (t && t.tagName === 'SCRIPT') {
          var el = document.getElementById('boot-splash')
          if (el) {
            el.innerHTML = '<strong>No se pudo cargar</strong><span>Recarga la página o abre:<br><a href="https://juridicofiscaleg-cell.github.io/integra-pld/">integra-pld</a></span>'
          }
        }
      }, true)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
